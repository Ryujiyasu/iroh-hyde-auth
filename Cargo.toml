[package]
name = "iroh-hyde-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Institutional, TPM-bound authentication for iroh connections via EndpointHooks and a separate auth ALPN, backed by hyde (ML-DSA / FIPS 204)."
repository = "https://github.com/Ryujiyasu/iroh-hyde-auth"
keywords = ["iroh", "authentication", "tpm", "tee", "post-quantum"]
categories = ["network-programming", "cryptography", "authentication"]
readme = "README.md"

[dependencies]
iroh = "=1.0.0-rc.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.8"
thiserror = "2"
tracing = "0.1"

# Only for the `ssh-agent` backend. Pinned to iroh's ed25519-dalek so the tree
# unifies on a single version.
ed25519-dalek = { version = "=3.0.0-pre.7", optional = true }

# Transitive pin for the shared RustCrypto stack.
#
# hyde-core is written against ml-dsa's `KeyGen`/`from_seed` API and its own lock
# uses 0.1.0-rc.8. But rc.8 demands the *pre-release* pkcs8 (`^0.11.0-rc.11`),
# while iroh's ed25519-dalek forces the *stable* pkcs8 0.11.0 — a single unified
# version that rc.8 cannot compile against (`pkcs8::Error::KeyMalformed`).
#
# ml-dsa 0.1.0-rc.10 is the one version that satisfies both: it still exports the
# `KeyGen` trait + `from_seed` (so hyde-core compiles unchanged) AND loosened its
# deps to `pkcs8 ^0.11` / `signature ^3` (so it coexists with iroh's stable
# stack). 0.1.0-rc.11+ dropped the `KeyGen` export and would break hyde-core.
ml-dsa = "=0.1.0-rc.10"

# hyde TEE facade (package `hyde-tee`), pinned to a published commit so this
# crate is clone-buildable. For local hyde development, override with e.g.:
#   [patch."https://gitlab.com/Ryujiyasu/hyde"]
#   hyde-tee = { path = "../hyde/crates/hyde" }
[dependencies.hyde]
package = "hyde-tee"
git = "https://gitlab.com/Ryujiyasu/hyde"
rev = "e8f984d63c3da9e845475789ff6c3c03df8b4150"
default-features = false

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[features]
# `tpm` is the production default: the institutional identity MUST be hardware-bound.
default = ["tpm"]
tpm = ["hyde/tpm"]
# `software` is for development, CI, and offline tests only — no hardware binding.
software = ["hyde/software"]
# `ssh-agent` adds a second institutional backend (ed25519 via a running agent),
# proving the signer/verifier traits are backend-agnostic. Unix only.
ssh-agent = ["dep:ed25519-dalek"]

[[example]]
name = "echo-auth"
required-features = ["software"]

[[example]]
name = "mutual-echo"
required-features = ["software"]
